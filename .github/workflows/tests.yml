name: Tests 🦆

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} 🦆
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository 🪺
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }} 🐍
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile the duck router 🦆
        run: python -m py_compile scripts/steves_rubber_duck.py

      - name: Validate the model catalog 📇🦆
        run: python scripts/steves_rubber_duck.py --list-models --format json

      - name: Run the duck tests 🧪🦆
        run: python -m unittest discover -s tests -v
